services:
  # Separate PostgreSQL for LiteLLM only
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm_password}
      POSTGRES_DB: litellm
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leo_default

  # LiteLLM (self-hosted proxy with UI)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_KEY=${OPENROUTER_KEY:-}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm_password}@litellm-db:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - UI_USERNAME=${LITELLM_UI_USERNAME:-admin}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:-admin}
      # Main database for usage logging callback
      - LEO_DATABASE_URL=${DATABASE_URL}
      - LEO_WEBHOOK_URL=http://leo-gateway:8080/api/v1/llm-webhook
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      # Python path for custom callbacks
      - PYTHONPATH=/app
      # LangSmith tracing
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-leo}
      - LANGCHAIN_TRACING_V2=true
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ./litellm_callbacks.py:/app/litellm_callbacks.py
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - leo_default

  # ChromaDB (vector store)
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    restart: unless-stopped
    networks:
      - leo_default

  # Leo Gateway - LiteLLM Proxy + Document Processing
  leo-gateway:
    build:
      context: ./services/leo-gateway
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - LITELLM_URL=http://litellm:4000
      - CHROMA_URL=http://chroma:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-claude-sonnet-4-6}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - NODE_ENV=production
      - API_SECRET=${API_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      - litellm
      - chroma
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`gateway.leoagent.ru`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=le"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    networks:
      - leo_default

  # Agent Orchestrator - Agent Manager
  agent-orchestrator:
    build:
      context: ./services/agent-orchestrator
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DATABASE_URL=${DATABASE_URL}
      - GATEWAY_URL=http://leo-gateway:8080
      - AGENT_IMAGE=leo-agent-runtime:latest
      - DOCKER_NETWORK=leo_default
      - NODE_ENV=production
      - API_SECRET=${API_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - leo-gateway
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.leoagent.ru`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls.certresolver=le"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8081"
    networks:
      - leo_default

networks:
  leo_default:
    external: true

volumes:
  chroma_data:
  litellm_postgres_data:
  letsencrypt_data:
