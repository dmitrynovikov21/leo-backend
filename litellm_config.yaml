model_list:
  # === Primary: claude-sonnet-4-6 ===
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-6
      api_key: os.environ/OPENROUTER_KEY

  # === Fallback 1: claude-opus-4-6 ===
  - model_name: claude-opus-4-6
    litellm_params:
      model: openrouter/anthropic/claude-opus-4-6
      api_key: os.environ/OPENROUTER_KEY

  # === Fallback 2: claude-sonnet-4-5 ===
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-5
      api_key: os.environ/OPENROUTER_KEY

  # === Fallback 3: gemini-3.1-pro-preview ===
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: openrouter/google/gemini-3.1-pro-preview
      api_key: os.environ/OPENROUTER_KEY

  # === Fallback 4: gemini-2.5-pro ===
  - model_name: gemini-2.5-pro
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: os.environ/OPENROUTER_KEY

  # === Utility: embeddings (not in fallback chain) ===
  - model_name: text-embedding-3-small
    litellm_params:
      model: text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  routing_strategy: "simple-shuffle"
  enable_pre_call_checks: true
  num_retries: 2
  timeout: 120
  retry_after: 3
  allowed_fails: 1
  fallbacks:
    - claude-sonnet-4-6: ["claude-opus-4-6", "claude-sonnet-4-5", "gemini-3.1-pro-preview", "gemini-2.5-pro"]

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks: ["langsmith", "litellm_callbacks.postgres_usage_logger"]

environment_variables:
  LANGSMITH_API_KEY: os.environ/LANGSMITH_API_KEY
  LANGSMITH_PROJECT: os.environ/LANGSMITH_PROJECT
  LANGCHAIN_TRACING_V2: "true"
